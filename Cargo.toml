[workspace]
resolver = "2"
members = ["redactkit-derive"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jezman/redactkit"

[workspace.dependencies]
redactkit-derive = { path = "redactkit-derive", version = "0.1.0" }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[package]
name = "redactkit"
description = "Prevent accidental leakage of secrets in Debug, tracing, and serialized output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/redactkit"
readme = "README.md"
keywords = ["redact", "secret", "security", "logging", "tracing"]
categories = ["development-tools", "rust-patterns"]

[features]
default = ["std", "derive"]
std = []
derive = ["dep:redactkit-derive"]
regex = ["dep:regex", "std"]
tracing = ["dep:tracing", "dep:tracing-subscriber", "std"]

[dependencies]
redactkit-derive = { workspace = true, optional = true }
regex = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["fmt"] }

[dev-dependencies]
trybuild = "1"
